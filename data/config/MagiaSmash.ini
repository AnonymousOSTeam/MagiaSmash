; ----------------------------------------------------------------------------
; Waves (spawned by the Python director)
; ----------------------------------------------------------------------------

[Wave1]
EnemyList       = Chiropteran # Chiropteran
SpawnX          = -650

[Wave2]
EnemyList       = Chiropteran # Chiropteran # Chiropteran
SpawnX          = 650

[Wave3]
EnemyList       = Chiropteran # BigChiropteran # Chiropteran
SpawnX          = -750

[Wave4]
EnemyList       = Chiropteran # Chiropteran # BigChiropteran # Chiropteran
SpawnX          = 750

[Wave5]
EnemyList       = BigChiropteran # Chiropteran # BigChiropteran
SpawnX          = -800

; ----------------------------------------------------------------------------
; FX & transient effects
; ----------------------------------------------------------------------------

[MiniShake]
SlotList        = @
Type            = scale
Curve           = sine
EndTime         = 0.12
EndValue        = 0.98

[DashPulse]
SlotList        = @
Type            = alpha
Curve           = sine
EndTime         = 0.25
StartValue      = -0.7
EndValue        = 0

[EffectFade]
SlotList        = @
Type            = alpha
Curve           = fast
StartTime       = 0
EndTime         = 0.12
StartValue      = -1
EndValue        = 0

[HitSpark]
Graphic         = @
Texture         = white.png
Pivot           = center
Size            = (70, 70)
RGB             = (1, 0.9, 0.35)
LifeTime        = 0.15
FXList          = EffectFade

[SlashArc]
Graphic         = @
Texture         = white.png
Pivot           = center
Size            = (180, 50)
RGB             = (0.85, 0.7, 1)
LifeTime        = 0.12
FXList          = EffectFade
