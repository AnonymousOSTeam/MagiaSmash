; MagiaSmash - 2D arena brawler prototype
;
; Content file: every fighter, move, wave and FX is pure data here.
; The C++ side (Fighter/GameHUD Scroll objects) binds to sections through
; config parenthood: [Saya@Fighter] automatically gets the Fighter class.

[Display]
Title           = MagiaSmash
IconList        = logo.webp
FullScreen      = false
ScreenWidth     = 1280
ScreenHeight    = 720
Decoration      = true
Smoothing       = true
VSync           = true

[Resource]
Texture         = bundle: # ../data/texture
Font            = bundle: # ../data/font
Sound           = bundle: # ../data/sound # ../data/music
Movie           = bundle: # ../data/movie
Python          = bundle: # ../data/python

[Python]
Main            = MagiaSmash.py

[Bundle]
ExcludeList     = MagiaSmash

[Clock]
AllowSleep      = false

[Config]
DefaultParent   = Default

[Default]
KeepInCache     = true

[Input]
KEY_ESCAPE      = Quit
KEY_R           = Restart
KEY_ENTER       = Restart
SetList         = PlayerControls

[PlayerControls]
MoveLeft        = KEY_LEFT # KEY_A
MoveRight       = KEY_RIGHT # KEY_D
Jump            = KEY_UP # KEY_W # SPACE
Dash            = KEY_LSHIFT # KEY_LCTRL # KEY_S
LightAttack     = KEY_J # KEY_X
HeavyAttack     = KEY_K # KEY_C

[Main]
ViewportList    = MainViewport

[MainViewport]
Camera          = MainCamera

[MainCamera]
FrustumWidth    = 1920
FrustumHeight   = 1080
FrustumFar      = 2
FrustumNear     = 0
Position        = -1 ; Objects with -1 <= Z <= 1 will be visible

[CameraShake]
MiniShake       = Object.AddFX ^ MiniShake

; ----------------------------------------------------------------------------
; Shared match state (C++ <-> Python data bridge)
; ----------------------------------------------------------------------------

[MatchState]
PlayerHealth    = 120
PlayerMaxHealth = 120
PlayerPosX      = 0
EnemiesAlive    = 0
Wave            = 0
WaveScale       = 1
GameState       = Playing
Message         = WAVE 1
MessageTimer    = 0

; ----------------------------------------------------------------------------
; Arena bounds (read by the Fighter physics integrator)
; ----------------------------------------------------------------------------

[Arena]
GroundY         = -400
WallX           = 900

; ----------------------------------------------------------------------------
; Scene (created once by the Python director)
; ----------------------------------------------------------------------------

[Game]
Unique          = true
ChildList       = MainCamera # Sky # Moon # Ground # GroundLine # HUD

; NB: orx draws the render list in descending Z order, so a HIGHER Z is
; drawn FIRST and ends up BEHIND. Background layers therefore use the
; highest Z, and the HUD uses the lowest (drawn last, on top).
[Sky]
Graphic         = @
Texture         = white.png
Pivot           = center
Size            = (2400, 1300)
RGB             = (0.05, 0.04, 0.12)
Position        = (0, 0, 0.9)

[Moon]
Graphic         = @
Texture         = white.png
Pivot           = center
Size            = (170, 170)
RGB             = (0.95, 0.92, 0.8)
Position        = (520, 280, 0.8)
Rotation        = 45

[Ground]
Graphic         = @
Texture         = white.png
Pivot           = top
Size            = (2400, 700)
RGB             = (0.16, 0.12, 0.2)
Position        = (0, -400, 0.6)

[GroundLine]
Graphic         = @
Texture         = white.png
Pivot           = top
Size            = (2400, 6)
RGB             = (0.5, 0.35, 0.7)
Position        = (0, -400, 0.5)

; ----------------------------------------------------------------------------
; HUD (bound to the GameHUD C++ class through @GameHUD)
; ----------------------------------------------------------------------------

[HUD@GameHUD]
Position        = (-900, 500, -0.5)
ChildList       = HPBarBack # HPBarFill # WaveLabel # FoesLabel # MessageLabel

[HPBarBack]
Graphic         = @
Texture         = white.png
Pivot           = top left
Size            = (330, 30)
RGB             = (0.1, 0.08, 0.14)
Position        = (0, 0)

; Scaled down on the X axis (left pivot) as the player's health drops
[HPBarFill]
Graphic         = @
Texture         = white.png
Pivot           = top left
Size            = (322, 22)
RGB             = (0.9, 0.25, 0.55)
Position        = (4, -4)

[WaveLabel]
Graphic         = @
Text            = @
String          = WAVE 0
Font            = GameFont
Position        = (0, -46)

[FoesLabel]
Graphic         = @
Text            = @
String          = FOES 0
Font            = GameFont
Position        = (0, -86)

; NB: the text lives in its own named graphic section so the object-only
; <Scale> key is not visible to the text loader (orx otherwise reports it as
; a near-miss for the graphic's <Locale> key during typo checking).
[MessageLabel]
Graphic         = MessageLabelText
Scale           = 1.6
RGB             = (1, 0.85, 0.3)
Position        = (900, -40)

[MessageLabelText]
Text            = @
String          = WAVE 1
Font            = GameFont

[GameFont]
; LazenbyComp by Disaster Fonts, licensed under CC-BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/)
Typeface        = LazenbyCompSmooth.ttf
SDF             = true
CharacterList   = " -()ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.!?"
GlowMin         = 0.2
GlowOffset      = (0.9, 0.9)
GlowColor       = (0.8, 0.1, 0.1)

; ----------------------------------------------------------------------------
; Fighters (base class section + characters)
; ----------------------------------------------------------------------------

[Fighter]
Graphic         = FighterGraphic
Health          = 100
MoveSpeed       = 600
JumpVelocity    = 1450
Gravity         = 3800
DashSpeed       = 1400
DashTime        = 0.16
KnockbackDamping= 0.05
DeathFade       = 1.0
AIAttackRange   = 150
AIAttackDelay   = 1.2
ComboList       = Light1 # Light2 # Light3
HeavyMove       = Heavy
AIMoveList      = Claw

[FighterGraphic]
Texture         = white.png
Pivot           = center
Size            = (80, 160)

[Saya@Fighter]
; The player: Saya, swordswoman (Blood+ homage)
RGB             = (0.95, 0.5, 0.8)
Health          = 120
MoveSpeed       = 620
IsPlayer        = true
Input           = PlayerControls
Team            = 0

[Chiropteran@Fighter]
RGB             = (0.45, 0.22, 0.55)
Health          = 55
MoveSpeed       = 400
AI              = true
Team            = 1
AIAttackRange   = 130
AIAttackDelay   = 1.5
AIMoveList      = Claw

[BigChiropteran@Chiropteran]
RGB             = (0.62, 0.12, 0.18)
Health          = 150
MoveSpeed       = 320
Size            = (130, 230)
Graphic         = BigChiropteranGraphic
DamageScale     = 1.6
AIAttackRange   = 170
AIAttackDelay   = 2.0

[BigChiropteranGraphic]
Texture         = white.png
Pivot           = center
Size            = (130, 230)

